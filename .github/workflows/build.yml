name: Build Kaelltzyy-G4YM1NK

on:
  workflow_dispatch:
    inputs:
      lto_mode:
        description: "LTO mode"
        type: choice
        default: thin
        options: [thin, full, none]
      bore_patch_url:
        description: "URL patch BORE (kosongkan kalau source sudah ada BORE / pakai patches/bore.patch di repo)"
        required: false
        default: "https://github.com/riza220201/itel-rs4-kernel/raw/refs/heads/main/patches/bore-5.10-kmi.patch"
      anykernel_repo:
        description: "Repo AnyKernel3"
        required: false
        default: "https://github.com/osm0sis/AnyKernel3"

env:
  DEFCONFIG: gki_defconfig
  KERNEL_NAME: Kaelltzyy-G4YM1NK
  ARCH: arm64
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Tambah swap 8G
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ambil source SuiKernel (kalau repo ini belum berisi source kernel)
        run: |
          if [ ! -f kernel/sched/fair.c ]; then
            git clone --depth=1 -b suikernel-experimental \
              https://github.com/LoggingNewMemory/SuiKernel-android12-5.10 /tmp/src
            rsync -a --exclude '.git' --exclude '.github' /tmp/src/ ./
          fi
          test -f kernel/sched/fair.c && echo "source kernel OK"
          ls

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio zip unzip git curl wget \
            python3 ccache lz4 xz-utils zstd dwarves libncurses-dev build-essential rsync \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Install Neutron clang
        run: |
          mkdir -p $HOME/neutron && cd $HOME/neutron
          bash <(curl -s https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) -S
          echo "$HOME/neutron/bin" >> $GITHUB_PATH
          $HOME/neutron/bin/clang --version | head -n1

      - name: Patch BORE
        run: |
          if grep -rq "CONFIG_SCHED_BORE" kernel/sched/ init/Kconfig 2>/dev/null; then
            echo "BORE sudah ada di source, skip patch"
          elif [ -n "${{ inputs.bore_patch_url }}" ]; then
            curl -L "${{ inputs.bore_patch_url }}" -o bore.patch
            patch -p1 --forward --no-backup-if-mismatch < bore.patch
          elif [ -f patches/bore.patch ]; then
            patch -p1 --forward --no-backup-if-mismatch < patches/bore.patch
          else
            echo "::error::BORE belum ada dan patch tidak diberikan"
            exit 1
          fi

      - name: Tambah governor Kaelltzyy (fork performance)
        run: |
          set -e
          SRC=drivers/cpufreq/cpufreq_performance.c
          DST=drivers/cpufreq/cpufreq_kaelltzyy.c
          cp $SRC $DST
          sed -i \
            -e 's/performance/kaelltzyy/g' \
            -e 's/PERFORMANCE/KAELLTZYY/g' \
            -e 's/Performance/Kaelltzyy/g' $DST

          # buang fungsi default/fallback governor biar nggak duplicate symbol
          python3 - <<'PY'
          import re
          p = "drivers/cpufreq/cpufreq_kaelltzyy.c"
          s = open(p).read()
          s = re.sub(r"struct cpufreq_governor \*cpufreq_(?:default|fallback)_governor\(void\)\s*\{[^}]*\}\n?", "", s)
          open(p, "w").write(s)
          PY
          grep -n "fallback_governor\|default_governor" $DST || echo "fungsi default/fallback sudah dibuang"

          # Makefile
          grep -q cpufreq_kaelltzyy drivers/cpufreq/Makefile || \
            sed -i '/CONFIG_CPU_FREQ_GOV_POWERSAVE/i obj-$(CONFIG_CPU_FREQ_GOV_KAELLTZYY)\t+= cpufreq_kaelltzyy.o' drivers/cpufreq/Makefile

          # Kconfig
          if ! grep -q CPU_FREQ_GOV_KAELLTZYY drivers/cpufreq/Kconfig; then
            python3 - <<'PY'
          p = "drivers/cpufreq/Kconfig"
          s = open(p).read()
          entry = (
              "config CPU_FREQ_GOV_KAELLTZYY\n"
              "\ttristate \"'kaelltzyy' cpufreq governor\"\n"
              "\tdepends on CPU_FREQ\n"
              "\thelp\n"
              "\t  Kaelltzyy governor, fork dari performance governor.\n\n"
          )
          marker = "config CPU_FREQ_GOV_POWERSAVE"
          s = s.replace(marker, entry + marker, 1)
          open(p, "w").write(s)
          PY
          fi
          grep -n KAELLTZYY drivers/cpufreq/Kconfig drivers/cpufreq/Makefile

      - name: Setup KernelSU-Next
        run: |
          echo "=== referensi ksu_pavolia_add_prop di source ==="
          grep -RIn ksu_pavolia_add_prop --include=*.c --include=*.h --include=Makefile --include=Kconfig . | head -20 || true
          if grep -RqI ksu_pavolia_add_prop drivers/kernelsu KernelSU 2>/dev/null; then
            echo "KernelSU bawaan source sudah punya ksu_pavolia_add_prop, skip setup KernelSU-Next"
          else
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          fi
          ls -la drivers/ | grep -i kernelsu || true

      - name: Fix undefined symbol ksu_pavolia_add_prop
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          SYM = "ksu_pavolia_add_prop"
          TYPES = r"(?:void|int|bool|long|ssize_t|size_t|u8|u16|u32|u64|char\s*\*)"
          pat = re.compile(
              r"^[ \t]*(?:extern\s+|static\s+)?(?:inline\s+)?(" + TYPES + r")\s+"
              + SYM + r"\s*\(([^;{)]*)\)\s*([;{])", re.M | re.S)
          decl = None
          defined = False
          callers = []
          for p in pathlib.Path(".").rglob("*"):
              if p.suffix not in (".c", ".h"): continue
              if ".git" in p.parts or p.parts[0] == "out": continue
              try: s = p.read_text(errors="ignore")
              except Exception: continue
              if SYM not in s: continue
              callers.append(str(p))
              for m in pat.finditer(s):
                  if m.group(3) == "{":
                      defined = True
                      print("DEFINISI ditemukan di", p)
                  elif decl is None:
                      decl = (str(p), m.group(1).strip(), " ".join(m.group(2).split()))
          print("file yang menyebut simbol:", callers)
          if defined:
              print("Simbol sudah punya definisi, tidak perlu stub")
              sys.exit(0)
          if decl is None:
              print("::warning::Prototype ksu_pavolia_add_prop tidak ketemu, stub tidak dibuat")
              sys.exit(0)
          hdr, ret, args = decl
          print("prototype ditemukan di", hdr, "->", ret, SYM, "(", args, ")")
          params = []
          if args and args != "void":
              for i, a in enumerate(x.strip() for x in args.split(",")):
                  words = a.replace("*", " * ").split()
                  last = words[-1] if words else ""
                  if a.endswith("*") or last in ("int","char","long","short","unsigned","void","bool","size_t","u8","u16","u32","u64","const") or len(words) < 2:
                      a = a + " a%d" % i
                  params.append(a)
          else:
              params = ["void"]
          body = "\treturn 0;\n" if ret != "void" and "*" not in ret else ("\treturn NULL;\n" if "*" in ret else "")
          code = (
              "#include <linux/kernel.h>\n#include <linux/types.h>\n"
              '#include "../%s"\n\n' % hdr
              + "%s %s(%s)\n{\n%s}\n" % (ret, SYM, ", ".join(params), body)
          )
          open("kernel/ksu_pavolia_stub.c", "w").write(code)
          mk = pathlib.Path("kernel/Makefile")
          t = mk.read_text()
          if "ksu_pavolia_stub.o" not in t:
              mk.write_text(t.rstrip("\n") + "\nobj-y += ksu_pavolia_stub.o\n")
          print("stub dibuat:\n" + code)
          PY

      - name: Konfigurasi kernel
        run: |
          set -e
          export PATH=$HOME/neutron/bin:$PATH
          MAKE="make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-"
          $MAKE $DEFCONFIG

          C="scripts/config --file out/.config"
          # nama kernel
          $C --set-str LOCALVERSION "-${KERNEL_NAME}"
          $C -d LOCALVERSION_AUTO
          # KernelSU-Next
          $C -e KSU
          # BORE
          $C -e SCHED_BORE || true
          # governor Kaelltzyy
          $C -e CPU_FREQ_GOV_KAELLTZYY
          # LTO
          case "${{ inputs.lto_mode }}" in
            thin) $C -d LTO_NONE -e LTO_CLANG -e LTO_CLANG_THIN -d LTO_CLANG_FULL ;;
            full) $C -d LTO_NONE -e LTO_CLANG -e LTO_CLANG_FULL -d LTO_CLANG_THIN ;;
            none) $C -e LTO_NONE -d LTO_CLANG ;;
          esac
          $MAKE olddefconfig

      - name: Build kernel
        run: |
          export PATH=$HOME/neutron/bin:$PATH
          export KBUILD_BUILD_USER=Kaelltzyy
          export KBUILD_BUILD_HOST=GitHubAction
          set -o pipefail
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- -j$(nproc --all) 2>&1 | tee build.log
          ls -lh out/arch/arm64/boot/

      - name: Tampilkan error build
        if: failure()
        run: |
          echo "=== 40 baris error pertama ==="
          grep -nE "error:|fatal error|undefined reference|ld.lld:|\*\*\*" build.log | head -40 || true
          echo "=== detail undefined symbol (siapa yang memanggil) ==="
          grep -n -A6 "undefined symbol" build.log | head -40 || true
          echo "=== lokasi ksu_pavolia_add_prop di source ==="
          grep -RIn ksu_pavolia_add_prop --include=*.c --include=*.h . | head -20 || true
          echo "=== isi drivers/kernelsu ==="
          ls -la drivers/kernelsu 2>/dev/null | head -20 || true

      - name: Cek versi kernel
        run: |
          strings out/arch/arm64/boot/Image | grep -m1 "Linux version"

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 "${{ inputs.anykernel_repo }}" AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/Image
          [ -f out/arch/arm64/boot/dtb ] && cp out/arch/arm64/boot/dtb AnyKernel3/ || true
          cd AnyKernel3
          rm -rf .git
          zip -r9 ../${KERNEL_NAME}-$(date +%Y%m%d-%H%M).zip . -x "*.md"
          cd ..
          ls -lh *.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}
          path: |
            *.zip
            build.log
